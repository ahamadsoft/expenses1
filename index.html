<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket Ledger · Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">₹</span>
      <h1>Pocket Ledger</h1>
    </div>
    <p id="status" class="status">Connecting…</p>
  </header>

  <main class="layout">
    <!-- Add expense -->
    <section class="card form-card">
      <h2>Add expense</h2>
      <form id="expenseForm" autocomplete="off">
        <label>
          What was it?
          <input id="title" type="text" required maxlength="60" placeholder="Coffee with Asha" />
        </label>

        <label>
          Amount
          <div class="amount-wrap">
            <span aria-hidden="true">₹</span>
            <input id="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" />
          </div>
        </label>

        <div>
          <span class="field-label">Category</span>
          <div id="catChips" class="chips"></div>
        </div>

        <label>
          Date
          <input id="date" type="date" required />
        </label>

        <button id="saveBtn" type="submit" class="btn-primary">Save expense</button>
      </form>
    </section>

    <div class="right">
      <!-- Summary tiles -->
      <div class="stats">
        <article class="stat s-coral">
          <span>Today</span>
          <strong id="statToday">₹0</strong>
        </article>
        <article class="stat s-sun">
          <span>This week</span>
          <strong id="statWeek">₹0</strong>
        </article>
        <article class="stat s-mint">
          <span>This month</span>
          <strong id="statMonth">₹0</strong>
        </article>
      </div>

      <!-- Trend chart -->
      <section class="card">
        <div class="card-head">
          <h2>Spending trend</h2>
          <div id="tabs" class="tabs" role="tablist">
            <button class="tab" role="tab" data-mode="day" aria-selected="true">Day</button>
            <button class="tab" role="tab" data-mode="week" aria-selected="false">Week</button>
            <button class="tab" role="tab" data-mode="month" aria-selected="false">Month</button>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="trendChart" aria-label="Spending trend chart"></canvas>
        </div>
      </section>

      <!-- Category breakdown -->
      <section class="card">
        <div class="card-head">
          <h2>This month by category</h2>
        </div>
        <div class="split">
          <div class="donut-box">
            <canvas id="catChart" aria-label="Category breakdown chart"></canvas>
          </div>
          <ul id="legend" class="legend"></ul>
        </div>
      </section>

      <!-- Recent transactions -->
      <section class="card">
        <div class="card-head">
          <h2>Recent expenses</h2>
        </div>
        <ul id="list" class="list"></ul>
      </section>
    </div>
  </main>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-compat.js"></script>
  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
